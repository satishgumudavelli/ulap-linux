[package]
name = "ulap-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
grammers-client = "0.12.0"
grammers-mtsender = "0.12.0"
grammers-session = "0.12.0"
grammers-tl-types = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "multipart", "query", "rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
walkdir = "2.5.1"
